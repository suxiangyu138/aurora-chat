<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link rel="stylesheet" href="katex.min.css">
<link rel="stylesheet" href="github.min.css">
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; padding: 0; background: transparent; }
  body {
    font: 15px/1.65 -apple-system, "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif;
    word-break: break-word;
    overflow-wrap: anywhere;
    -webkit-text-size-adjust: 100%;
  }
  #content { padding: 1px 0; }
  p { margin: 0.35em 0; }
  h1, h2, h3, h4, h5, h6 { margin: 0.7em 0 0.3em; line-height: 1.35; }
  h1 { font-size: 1.35em; } h2 { font-size: 1.25em; } h3 { font-size: 1.15em; }
  h4, h5, h6 { font-size: 1.05em; }
  ul, ol { margin: 0.35em 0; padding-left: 1.5em; }
  li { margin: 0.15em 0; }
  blockquote {
    margin: 0.5em 0; padding: 0.2em 0.8em;
    border-left: 3px solid rgba(128, 128, 128, 0.5);
    color: rgba(128, 128, 128, 1);
  }
  code {
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    font-size: 0.88em;
  }
  :not(pre) > code {
    background: rgba(128, 128, 128, 0.18);
    padding: 0.1em 0.35em;
    border-radius: 4px;
  }
  pre {
    margin: 0.5em 0; padding: 10px 12px;
    background: rgba(128, 128, 128, 0.14);
    border-radius: 8px;
    overflow-x: auto;
  }
  pre code { background: transparent; padding: 0; }
  table {
    border-collapse: collapse; margin: 0.5em 0;
    display: block; overflow-x: auto; max-width: 100%;
  }
  th, td { border: 1px solid rgba(128, 128, 128, 0.45); padding: 4px 10px; }
  th { background: rgba(128, 128, 128, 0.15); }
  hr { border: none; border-top: 1px solid rgba(128, 128, 128, 0.4); margin: 0.8em 0; }
  img { max-width: 100%; }
  a { text-decoration: none; }
  .katex { font-size: 1.06em; }
  .katex-display { margin: 0.5em 0; }
</style>
</head>
<body>
<div id="content"></div>
<script src="markdown-it.min.js"></script>
<script src="katex.min.js"></script>
<script src="highlight.min.js"></script>
<script src="render.js"></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link rel="stylesheet" href="katex.min.css">
<link rel="stylesheet" href="github.min.css">
<style>
  :root { color-scheme: light dark; }
  /* 不要给 html/body 设 height:100% + overflow:auto —— Android WebView 下百分比高度
     会算成 0px(实测 getComputedStyle(html).height === "0px"),body 于是不再是滚动
     容器(clientHeight=0),贴底判定恒为 false:自动跟随失效、回到底部按钮不消失。
     改为让文档自身滚动(window 滚动),不依赖具体滚动元素。 */
  html, body { margin: 0; padding: 0; background: transparent; }
  body {
    font: 15px/1.65 -apple-system, "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif;
    word-break: break-word;
    overflow-wrap: anywhere;
    -webkit-text-size-adjust: 100%;
  }
  #root { padding: 12px 10px 8px; }

  /* ---------- 消息行 ---------- */
  .row { display: flex; align-items: flex-start; margin-bottom: 10px; }
  .row.user { justify-content: flex-end; }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%; flex: none;
    display: flex; align-items: center; justify-content: center;
    margin-right: 6px; color: #fff; font-size: 15px;
    background: linear-gradient(135deg, #0D9488, #6366F1, #C026D3);
  }
  .bubble {
    max-width: 72%; border-radius: 16px; padding: 8px 12px;
    word-break: break-word; overflow-wrap: anywhere;
  }
  .msg-menu {
    border: none; background: transparent; color: inherit;
    opacity: 0.4; font-size: 15px; padding: 4px 6px; line-height: 1;
    flex: none; cursor: pointer;
  }

  /* ---------- 气泡内容 ---------- */
  .content p { margin: 0.35em 0; }
  .content h1, .content h2, .content h3, .content h4, .content h5, .content h6 {
    margin: 0.7em 0 0.3em; line-height: 1.35;
  }
  .content h1 { font-size: 1.35em; } .content h2 { font-size: 1.25em; }
  .content h3 { font-size: 1.15em; } .content h4, .content h5, .content h6 { font-size: 1.05em; }
  .content ul, .content ol { margin: 0.35em 0; padding-left: 1.5em; }
  .content li { margin: 0.15em 0; }
  .content blockquote {
    margin: 0.5em 0; padding: 0.2em 0.8em;
    border-left: 3px solid rgba(128, 128, 128, 0.5);
    color: rgba(128, 128, 128, 1);
  }
  .content code {
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    font-size: 0.88em;
  }
  .content :not(pre) > code {
    background: rgba(128, 128, 128, 0.18);
    padding: 0.1em 0.35em; border-radius: 4px;
  }
  .content pre {
    position: relative;
    margin: 0.5em 0; padding: 10px 12px;
    background: rgba(128, 128, 128, 0.14);
    border-radius: 8px;
    overflow-x: auto;
  }
  .content pre code { background: transparent; padding: 0; }
  .code-copy {
    position: absolute; top: 6px; right: 6px;
    font-size: 11px; line-height: 1.4; padding: 2px 10px;
    border-radius: 4px; border: 1px solid rgba(128, 128, 128, 0.5);
    background: rgba(128, 128, 128, 0.2); color: inherit; cursor: pointer;
  }
  .content table { border-collapse: collapse; margin: 0.5em 0; display: block; overflow-x: auto; max-width: 100%; }
  .content th, .content td { border: 1px solid rgba(128, 128, 128, 0.45); padding: 4px 10px; }
  .content th { background: rgba(128, 128, 128, 0.15); }
  .content hr { border: none; border-top: 1px solid rgba(128, 128, 128, 0.4); margin: 0.8em 0; }
  .content img { max-width: 100%; }
  .content a { text-decoration: none; }
  .katex { font-size: 1.06em; }
  .katex-display { margin: 0.5em 0; }

  /* ---------- 图片 ---------- */
  img.msg-image { max-width: 100%; border-radius: 10px; margin-top: 6px; display: block; }

  /* ---------- 思考过程 ---------- */
  .reasoning { margin-bottom: 6px; }
  .reasoning-header {
    font-size: 12px; opacity: 0.65; cursor: pointer;
    padding: 3px 0; user-select: none;
  }
  .reasoning-body {
    font-size: 13px; opacity: 0.8; white-space: pre-wrap;
    border-left: 2px solid rgba(128, 128, 128, 0.35);
    padding-left: 8px; margin-top: 2px;
  }
  .reasoning + .content, .reasoning + .retry-row { margin-top: 2px; }

  /* ---------- 失败重试 ---------- */
  .retry-row { text-align: right; margin-top: 4px; }
  .retry-btn {
    font-size: 12px; padding: 3px 14px; border-radius: 6px;
    border: 1px solid currentColor; background: transparent;
    color: inherit; cursor: pointer;
  }

  /* ---------- 呼吸灯 ---------- */
  .streaming-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #6366F1; display: inline-block; margin-right: 6px;
    animation: breath 0.9s ease-in-out infinite;
  }
  @keyframes breath {
    0%, 100% { opacity: 0.25; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.3); }
  }
  .caret { opacity: 0.55; margin-left: 1px; }

  /* ---------- 加载更早 ---------- */
  #load-more { text-align: center; margin-bottom: 10px; }
  .load-more-btn {
    font-size: 13px; padding: 4px 18px; border-radius: 14px;
    border: 1px solid rgba(128, 128, 128, 0.4);
    background: rgba(128, 128, 128, 0.12); color: inherit; cursor: pointer;
  }
</style>
</head>
<body>
<!-- #chat 存已入库消息(每次 setMessages 整体重写),#stream 存流式行(不被重写波及) -->
<div id="root">
  <div id="chat"></div>
  <div id="stream"></div>
</div>
<script src="markdown-it.min.js"></script>
<script src="katex.min.js"></script>
<script src="highlight.min.js"></script>
<script src="chat.js"></script>
</body>
</html>
